name: Build Android APK

# Produces an installable debug APK in the cloud — no local Android SDK needed.
# After a run finishes, download it from the run's "Artifacts" section.

on:
  push:
    paths:
      - "android-child/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-child
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guardian-debug-apk
          path: android-child/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
