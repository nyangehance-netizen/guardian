name: Build Android APK

# Produces an installable debug APK in the cloud — no local Android SDK needed.
# After a run finishes, download it from the run's "Artifacts" section.

on:
  push:
    paths:
      - "android-child/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-child
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships with the Android SDK preinstalled (ANDROID_HOME set).
      # Accept licenses and make sure the exact platform/build-tools are present.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guardian-debug-apk
          path: android-child/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
